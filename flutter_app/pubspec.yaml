name: nuankebao
description: 暖客宝 大健康销售 CRM (移动端)
publish_to: 'none'
version: 0.2.6+7

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 路由
  go_router: ^14.6.1

  # HTTP
  dio: ^5.7.0

  # 数据类
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 安全存储
  flutter_secure_storage: ^9.2.2

  # 拍照 / 选图
  image_picker: ^1.1.2

  # 离线缓存
  sqflite: ^2.4.0
  path_provider: ^2.1.5

  # 工具
  intl: ^0.19.0
  # 农历/阳历转换 (生日提醒用; 6tail, MIT, 213 star)
  # 主人 2026-09-18 拍: 生日支持农历/阳历 + 提醒
  lunar: ^1.7.8
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  fluttertoast: ^8.2.8
  url_launcher: ^6.3.1
  fl_chart: ^0.69.0

  # 国际化
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  package_info_plus: ^8.0.0
  flutter_cache_manager: ^3.4.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  # ⚠ 目录声明**不递归**: `assets/` 只收本层文件, 子目录要单独列
  #   (2026-09-18: `assets/icons/nuankebao-logo.png` 一直没进包 → 登录页 logo 是破图,
  #    widget 测试当场报 "Unable to load asset" 才发现。扫了一遍资产目录, 现只有 icons/ 一层)
  assets:
    - assets/
    - assets/icons/
