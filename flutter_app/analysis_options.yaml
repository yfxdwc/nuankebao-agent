# ============================================
# Flutter 静态分析配置
# ============================================

analyzer:
  exclude:
    # 生成代码 (freezed/json_serializable): 不参与 lint
    #   —— 生成器会把源文件的 // ignore: 注释复制到多处, 触发 duplicate_ignore 噪声
    #   (2026-09-22 加 hasAccount 字段重新生成后发现); 编译错误仍由 dart 编译器抦
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - build/**
    - android/**
    - web/**
    - linux/**

  errors:
    # 已废弃的 CustomerRow isFranchisee 字段 (TODO F2.5)
    invalid_assignment: ignore

linter:
  rules:
    avoid_print: false  # 允许 print() 在 main.dart 等调试用
    avoid_unused_constructor_parameters: false