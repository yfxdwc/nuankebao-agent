# JVM 内存 (2026-09-19 P4: 从 -Xmx4G/2G 降为 3G/1G —— 与另一会话/dev server 共享 15G 机器,
# 之前 package_info_plus:mergeReleaseShaders 因 native thread/内存压力失败)
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
# 并发限制 (共享机器构建更稳)
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# W5 build fix: 禁用 AGP 配置缓存 (AGP 9+ 默认缓存, 与 Flutter 3.47 plugin 冲突)
org.gradle.unsafe.configuration-cache=false
