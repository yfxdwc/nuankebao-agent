# ============================================
# 暖客宝 生产栈 (tc 本机 Docker 隔离; 后续可整体搬云)
#
# 用法:
#   docker compose -p nuankebao-prod -f docker-compose.prod.yml --env-file .env.prod up -d
#   docker compose -p nuankebao-prod -f docker-compose.prod.yml --env-file .env.prod \
#     run --rm migrate pnpm db:migrate
#   bash deploy/prod-deploy.sh   (封装以上流程 + 健康检查/回滚)
#
# 与 dev 的隔离 (docs/deploy/production-plan.md §2):
#   - 项目名 nuankebao-prod / 容器 nuankebao-prod-*
#   - 数据卷 nuankebao-prod-postgres-data / nuankebao-prod-uploads (dev 卷不动)
#   - web 只绑 127.0.0.1:${PROD_WEB_PORT:-3004} (dev 是 3003)
#   - postgres 不映射 host 端口
# 反代: tc 由 cloudflared-tc-prod.service 指 127.0.0.1:3004 (不跑 nginx 容器;
#      上云后用 host nginx, 见 production-plan 附录 A)
# ============================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nuankebao-prod-postgres
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuankebao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-nuankebao}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuankebao} -d ${POSTGRES_DB:-nuankebao}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod-net

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    container_name: nuankebao-prod-web
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nuankebao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nuankebao}
      NODE_ENV: production
      # Next.js standalone 默认用 $HOSTNAME 绑定 (Docker 会注入容器 ID 主机名)
      # → 只绑容器 IP, 容器内 127.0.0.1 healthcheck 失败 (2026-09-19 实测)
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:${PROD_WEB_PORT:-3004}:3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - prod-net

  # migration runner (tools profile):
  #   docker compose ... run --rm migrate pnpm db:migrate
  # 说明: 运行镜像只有 standalone 产物, 没有 tsx/drizzle/tools; 本 target 专门跑迁移。
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    profiles: ["tools"]
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nuankebao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nuankebao}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prod-net
    restart: "no"

networks:
  prod-net:
    name: nuankebao-prod-net
    driver: bridge

volumes:
  postgres-data:
    name: nuankebao-prod-postgres-data
  uploads:
    name: nuankebao-prod-uploads
