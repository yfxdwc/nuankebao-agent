services:
  postgres:
    # pgvector/pgvector:pg16 镜像: 含 pgcrypto + pgvector
    # 注意: 不要用 postgres:16-alpine (默认不含 pgvector)
    #      pgvector/pgvector:pg16-alpine tag 不存在
    #      pgvector/pgvector:pg16 (debian) 是官方支持 tag
    # 注: 2026-09-07 全切 nuankebao, container_name / volume_name 跟产品名一致 (见 AGENTS.md §6.1)。
    # 容器内部 PG user/db 已切到 nuankebao。
    image: pgvector/pgvector:pg16
    container_name: nuankebao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuankebao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuankebao_password}
      POSTGRES_DB: ${POSTGRES_DB:-nuankebao}
      # 2026-09-25 timezone 切换: 与 prod 保持一致
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuankebao} -d ${POSTGRES_DB:-nuankebao}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nuankebao-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nuankebao}:${POSTGRES_PASSWORD:-nuankebao_password}@postgres:5432/${POSTGRES_DB:-nuankebao}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_URL: ${AUTH_URL:-http://localhost:3003}
      NODE_ENV: production
      # 2026-09-25 timezone 切换: 显式注入 TZ; dev web 同为 Alpine, 需挂 zoneinfo
      TZ: Asia/Shanghai
    volumes:
      # 2026-09-25 timezone 切换: dev web (Alpine) 同 prod 挂 host zoneinfo + /etc/localtime
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    ports:
      - "${APP_PORT:-3003}:3000"

volumes:
  postgres-data:
    name: nuankebao-postgres-data